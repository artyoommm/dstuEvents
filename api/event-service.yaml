openapi: 3.1.0

info:
  title: event-service
  version: 1.0.0
  description: |
    Сервис каталога мероприятий: создание, публикация, отмена, резервирование мест.
    Public-эндпоинты доступны через API Gateway (JWT).
    Internal-эндпоинты вызываются другими сервисами напрямую.
  license:
    name: Educational project
    url: https://example.org/license

servers:
  - url: /
    description: API Gateway (public endpoints)

tags:
  - name: events
    description: Публичный каталог мероприятий
  - name: admin
    description: Управление мероприятиями (роль ADMIN)
  - name: internal
    description: Внутренние эндпоинты для других сервисов

security:
  - bearerAuth: []

paths:

  /api/v1/events:
    get:
      tags: [events]
      summary: Афиша мероприятий
      operationId: listEvents
      parameters:
        - name: type
          in: query
          description: Тип мероприятия
          schema: { type: string, enum: [CONFERENCE, SPORT, CULTURAL, OPEN_DAY] }
          example: OPEN_DAY
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
          example: "2026-11-01T00:00:00Z"
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
          example: "2026-11-30T23:59:59Z"
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Страница мероприятий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedEvents' }
              example:
                content:
                  - id: "9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a"
                    title: "День открытых дверей ИТ-факультета"
                    type: OPEN_DAY
                    status: PUBLISHED
                    startsAt: "2026-11-15T10:00:00Z"
                    seatsAvailable: 42
                  - id: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
                    title: "Спартакиада ДГТУ"
                    type: SPORT
                    status: PUBLISHED
                    startsAt: "2026-11-20T09:00:00Z"
                    seatsAvailable: 120
                page: 0
                size: 20
                totalElements: 2
                totalPages: 1
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/events/{id}:
    get:
      tags: [events]
      summary: Карточка мероприятия
      operationId: getEvent
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Мероприятие
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
              example:
                id: "9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a"
                title: "День открытых дверей ИТ-факультета"
                description: "Знакомство с кафедрами и лабораториями"
                type: OPEN_DAY
                status: PUBLISHED
                startsAt: "2026-11-15T10:00:00Z"
                endsAt: "2026-11-15T14:00:00Z"
                venue: { id: 12, building: "Корпус 8", room: "401", capacity: 200 }
                seatLimit: 150
                seatsAvailable: 42
                createdAt: "2026-10-01T08:00:00Z"
                updatedAt: "2026-10-01T08:00:00Z"
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/events:
    post:
      tags: [admin]
      summary: Создать мероприятие
      description: Требуется роль ADMIN.
      operationId: createEvent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventRequest' }
            example:
              title: "День открытых дверей ИТ-факультета"
              description: "Знакомство с кафедрами и лабораториями"
              type: OPEN_DAY
              startsAt: "2026-11-15T10:00:00Z"
              endsAt: "2026-11-15T14:00:00Z"
              venueId: 12
              seatLimit: 150
      responses:
        '201':
          description: Мероприятие создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
              example:
                id: "9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a"
                title: "День открытых дверей ИТ-факультета"
                type: OPEN_DAY
                status: DRAFT
                startsAt: "2026-11-15T10:00:00Z"
                seatsAvailable: 150
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/events/{id}:
    put:
      tags: [admin]
      summary: Обновить мероприятие
      operationId: updateEvent
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventRequest' }
            example:
              title: "День открытых дверей ИТ-факультета (обновлено)"
              seatLimit: 120
      responses:
        '200':
          description: Мероприятие обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
              example:
                id: "9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a"
                title: "День открытых дверей ИТ-факультета (обновлено)"
                type: OPEN_DAY
                status: PUBLISHED
                seatLimit: 120
                seatsAvailable: 42
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [admin]
      summary: Отменить мероприятие
      description: Требуется роль ADMIN. Публикует event.cancelled.
      operationId: cancelEvent
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Мероприятие отменено
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/events/{id}/seats/reserve:
    post:
      tags: [internal]
      summary: Зарезервировать место
      description: Вызывается registration-service при записи студента.
      operationId: reserveSeat
      security: []
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveSeatRequest' }
            example:
              studentId: "3f6c2b0e-8d1a-4c57-9e2f-5a1b7c9d0e44"
              registrationId: "b2e0c7f4-1a93-4f0d-8c6e-7d25a1e9f310"
      responses:
        '200':
          description: Место зарезервировано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatReservation' }
              example:
                eventId: "9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a"
                registrationId: "b2e0c7f4-1a93-4f0d-8c6e-7d25a1e9f310"
                reservedAt: "2026-10-14T12:00:00Z"
                expiresAt: "2026-10-14T12:15:00Z"
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Свободных мест нет
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /internal/v1/events/{id}/seats/release:
    post:
      tags: [internal]
      summary: Освободить место
      description: Вызывается registration-service при отмене или компенсации.
      operationId: releaseSeat
      security: []
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseSeatRequest' }
            example:
              studentId: "3f6c2b0e-8d1a-4c57-9e2f-5a1b7c9d0e44"
              registrationId: "b2e0c7f4-1a93-4f0d-8c6e-7d25a1e9f310"
              reason: BANNED_STUDENT
      responses:
        '200':
          description: Место возвращено в пул
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatReservation' }
              example:
                eventId: "9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a"
                registrationId: "b2e0c7f4-1a93-4f0d-8c6e-7d25a1e9f310"
                reservedAt: "2026-10-14T12:00:00Z"
                expiresAt: "2026-10-14T12:15:00Z"
        '404': { $ref: '#/components/responses/NotFound' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    EventIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Не авторизован
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Доступ запрещён
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:          { type: string, format: uri }
        title:         { type: string }
        status:        { type: integer }
        detail:        { type: string }
        instance:      { type: string }
        correlationId: { type: string, format: uuid }
      example:
        type: "https://dstu-events.local/errors/conflict"
        title: "No seats available"
        status: 409
        detail: "Event 9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a has no free seats"
        instance: "/internal/v1/events/9a4d1e2c-6b7f-4a08-b3c5-0e1f2d3c4b5a/seats/reserve"
        correlationId: "3f6c2b0e-8d1a-4c57-9e2f-5a1b7c9d0e44"

    Venue:
      type: object
      required: [id, building, room, capacity]
      properties:
        id:       { type: integer }
        building: { type: string, maxLength: 100 }
        room:     { type: string, maxLength: 50 }
        capacity: { type: integer, minimum: 1 }

    Event:
      type: object
      required: [id, title, type, status, startsAt, venue, seatLimit, seatsAvailable]
      properties:
        id:             { type: string, format: uuid }
        title:          { type: string, maxLength: 200 }
        description:    { type: string, maxLength: 2000 }
        type:           { type: string, enum: [CONFERENCE, SPORT, CULTURAL, OPEN_DAY] }
        status:         { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED] }
        startsAt:       { type: string, format: date-time }
        endsAt:         { type: string, format: date-time }
        venue:          { $ref: '#/components/schemas/Venue' }
        seatLimit:      { type: integer, minimum: 1 }
        seatsAvailable: { type: integer, minimum: 0 }
        createdAt:      { type: string, format: date-time }
        updatedAt:      { type: string, format: date-time }

    EventSummary:
      type: object
      required: [id, title, type, status, startsAt, seatsAvailable]
      properties:
        id:             { type: string, format: uuid }
        title:          { type: string }
        type:           { type: string, enum: [CONFERENCE, SPORT, CULTURAL, OPEN_DAY] }
        status:         { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED] }
        startsAt:       { type: string, format: date-time }
        seatsAvailable: { type: integer, minimum: 0 }

    CreateEventRequest:
      type: object
      required: [title, type, startsAt, endsAt, venueId, seatLimit]
      properties:
        title:       { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        type:        { type: string, enum: [CONFERENCE, SPORT, CULTURAL, OPEN_DAY] }
        startsAt:    { type: string, format: date-time }
        endsAt:      { type: string, format: date-time }
        venueId:     { type: integer }
        seatLimit:   { type: integer, minimum: 1 }

    UpdateEventRequest:
      type: object
      properties:
        title:       { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        startsAt:    { type: string, format: date-time }
        endsAt:      { type: string, format: date-time }
        venueId:     { type: integer }
        seatLimit:   { type: integer, minimum: 1 }

    ReserveSeatRequest:
      type: object
      required: [studentId, registrationId]
      properties:
        studentId:      { type: string, format: uuid }
        registrationId: { type: string, format: uuid }

    ReleaseSeatRequest:
      type: object
      required: [studentId, registrationId, reason]
      properties:
        studentId:      { type: string, format: uuid }
        registrationId: { type: string, format: uuid }
        reason:         { type: string, enum: [CANCELLED_BY_STUDENT, BANNED_STUDENT, EVENT_CANCELLED, EXPIRED] }

    SeatReservation:
      type: object
      required: [eventId, registrationId, reservedAt, expiresAt]
      properties:
        eventId:        { type: string, format: uuid }
        registrationId: { type: string, format: uuid }
        reservedAt:     { type: string, format: date-time }
        expiresAt:      { type: string, format: date-time, description: "TTL 15 минут" }

    PaginatedEvents:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/EventSummary' }
        page:          { type: integer }
        size:          { type: integer }
        totalElements: { type: integer }
        totalPages:    { type: integer }